# Builds web/ and publishes it to GitHub Pages on every push to main.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Publish Student B's listening game and quiz player next to the app, at /tools/.
      # The game loads ../assets/frames/svs3912/<still>.jpg. That NASA still is not committed
      # (assets/frames/ is git-ignored), so it is downloaded here, straight from NASA SVS 3912.
      - name: Add listening tools and their NASA still
        run: |
          mkdir -p dist/tools dist/assets/frames/svs3912
          cp ../tools/listening_game.html ../tools/listening_quiz_player.html dist/tools/
          curl --fail --silent --show-error --retry 3 \
            -o dist/assets/frames/svs3912/flat_global_ecco2_2028x1024.25000.jpg \
            https://svs.gsfc.nasa.gov/vis/a000000/a003900/a003912/flat_global_ecco2_2028x1024.25000.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
